name: Feature Request
description: Suggest an idea or enhancement for Shollu Android
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting new features for Shollu!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: Detailed description of what you want to happen.
    validations:
      required: true
