name: Bug Report
description: File a bug report for Shollu Android
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Shollu Version
      placeholder: e.g. v3.10.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & Android Version
      placeholder: e.g. Google Pixel 8, Android 14
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
    validations:
      required: true
