name: CD - Build & Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v3.10.1)'
        required: true
        default: 'v3.10.1'

permissions:
  contents: write
  packages: write

jobs:
  release-build:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Run Quality & Verification Tests
        run: gradle test --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace

      - name: Generate Checksums
        run: |
          mkdir -p release-artifacts
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-artifacts/ \;
          cd release-artifacts
          sha256sum *.apk > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts/*.apk
            release-artifacts/checksums-sha256.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
