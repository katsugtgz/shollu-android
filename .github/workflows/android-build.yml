name: Android CI - Build & Release APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TOOL_VERSION: 8.1.1
  COMPILE_SDK: 35
  MIN_SDK: 26
  TARGET_SDK: 35

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Grant execute permission to gradlew
      run: chmod +x ./gradlew
    
    # Debug: List files
    - name: Check Project Structure
      run: |
        echo "=== Directory Structure ==="
        ls -la
        echo "=== Gradle Files ==="
        ls -la *.gradle* || true
        echo "=== App Module ==="
        ls -la app/ || true
    
    # Run tests first
    - name: Run Tests
      run: ./gradlew test --stacktrace
      continue-on-error: true
    
    # Build Debug APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      continue-on-error: false
      
    # Upload Debug Artifacts
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7

  release-build:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Extract version from tag
      id: extract_version
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        VERSION=${TAG_NAME#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Grant execute permission to gradlew
      run: chmod +x ./gradlew
    
    # Read secrets for signing
    - name: Create keystore file
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "✅ Keystore created successfully"
        else
          echo "⚠️ No keystore provided - will use default debug key"
        fi
    
    - name: Configure signing properties (if available)
      env:
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      run: |
        if [ -n "$SIGNING_KEY_ALIAS" ]; then
          cat << EOF > gradle.properties.local
          android.useAndroidX=true
          android.enableJetifier=true
        
          # Signing configuration
          RELEASE_KEY_ALIAS=$SIGNING_KEY_ALIAS
          RELEASE_STORE_FILE=app/release.keystore
          RELEASE_KEY_PASSWORD=$SIGNING_KEY_PASSWORD
          RELEASE_STORE_PASSWORD=$SIGNING_STORE_PASSWORD
          EOF
          echo "📝 Signing properties configured"
        else
          echo "⚠️ Signing credentials not provided"
          cat << EOF > gradle.properties.local
          android.useAndroidX=true
          android.enableJetifier=true
          # Using debug signing
          EOF
        fi
    
    # Build Release APK
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      continue-on-error: false
    
    # Build AAB (Android App Bundle for Play Store)
    - name: Build AAB
      run: ./gradlew bundleRelease --stacktrace
      continue-on-error: false
    
    # Upload Release APK
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/app-release*.apk
        retention-days: 30
    
    # Upload AAB
    - name: Upload Release AAB
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: app/build/outputs/bundle/release/*.aab
        retention-days: 30
    
    # Create GitHub Release
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        tag_name: ${{ github.ref }}
        name: Shollu Android v${{ steps.extract_version.outputs.version }}
        draft: false
        prerelease: false
        files: |
          app/build/outputs/apk/release/app-release*.apk
          app/build/outputs/bundle/release/*.aab
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: release-build
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - name: Release Status
      run: |
        if [ "${{ needs.release-build.result }}" == "success" ]; then
          echo "✅ Release built successfully!"
          echo "Download APKs from the GitHub Release page"
        else
          echo "❌ Release build failed"
        fi
