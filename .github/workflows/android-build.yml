name: Android CI - Build & Release APK

on:
  push:
    branches: [ "main", "develop" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TOOL_VERSION: 36.0.0
  COMPILE_SDK: 37
  MIN_SDK: 26
  TARGET_SDK: 36

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install Android SDK platform 37 + build-tools 36
      run: |
        SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKM" --licenses > /dev/null || true
        "$SDKM" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Grant execute permission to gradlew
      run: chmod +x ./gradlew
    
    # Debug: List files
    - name: Check Project Structure
      run: |
        echo "=== Directory Structure ==="
        ls -la
        echo "=== Gradle Files ==="
        ls -la *.gradle* || true
        echo "=== App Module ==="
        ls -la app/ || true
    
    # Fail fast if any build/runtime dependency resolves below a Dependabot patched floor
    - name: Dependency Security Gate
      run: ./gradlew verifyDependencySecurity --stacktrace
      continue-on-error: false

    # Run tests first (fail build if tests fail)
    - name: Run Tests
      run: ./gradlew test --stacktrace
      continue-on-error: false
    
    # Build Debug APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      continue-on-error: false
      
    # Upload Debug Artifacts
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7

  release-build:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required for creating GitHub releases
    
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Install Android SDK platform 37 + build-tools 36
      run: |
        SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKM" --licenses > /dev/null || true
        "$SDKM" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

    - name: Extract version from tag
      id: extract_version
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        VERSION=${TAG_NAME#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

        # Derive a monotonically increasing versionCode from the semver tag: MAJOR*10000 + MINOR*100 + PATCH
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        MAJOR=$(echo "${MAJOR:-0}" | tr -cd '0-9');  MAJOR=${MAJOR:-0}
        MINOR=$(echo "${MINOR:-0}" | tr -cd '0-9');  MINOR=${MINOR:-0}
        PATCH=$(echo "${PATCH%%-*}" | tr -cd '0-9'); PATCH=${PATCH:-0}
        # Formula collides if MINOR or PATCH exceeds 99 - refuse rather than emit a colliding code
        if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
          echo "::error::Tag v$VERSION: MINOR and PATCH must be <= 99 for versionCode derivation (MAJOR*10000+MINOR*100+PATCH)"
          exit 1
        fi
        VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
        echo "Computed versionCode: $VERSION_CODE"

        # Export for all subsequent steps; build.gradle.kts reads these env vars
        echo "RELEASE_VERSION_NAME=$VERSION" >> $GITHUB_ENV
        echo "RELEASE_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Grant execute permission to gradlew
      run: chmod +x ./gradlew
    
    # Read secrets for signing - export as env vars that Gradle can read
    - name: Setup signing credentials
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      run: |
        # Release builds must be signed with the release keystore - fail fast if secrets are missing
        MISSING=""
        [ -z "$KEYSTORE_BASE64" ] && MISSING="$MISSING KEYSTORE_BASE64"
        [ -z "$SIGNING_KEY_ALIAS" ] && MISSING="$MISSING SIGNING_KEY_ALIAS"
        [ -z "$SIGNING_KEY_PASSWORD" ] && MISSING="$MISSING SIGNING_KEY_PASSWORD"
        [ -z "$SIGNING_STORE_PASSWORD" ] && MISSING="$MISSING SIGNING_STORE_PASSWORD"
        if [ -n "$MISSING" ]; then
          echo "::error::Release signing secrets not set:$MISSING — see QUICKSTART.md Step 3 (gh secret set ...)"
          exit 1
        fi

        echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
        echo "✅ Keystore created successfully at app/release.keystore"

        # Export signing credentials for all subsequent steps (build.gradle.kts reads RELEASE_*)
        echo "RELEASE_STORE_FILE=app/release.keystore" >> $GITHUB_ENV
        echo "RELEASE_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> $GITHUB_ENV
        echo "RELEASE_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> $GITHUB_ENV
        echo "RELEASE_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> $GITHUB_ENV
    
    # Build Release APK (Gradle reads RELEASE_* env vars exported to GITHUB_ENV above)
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      continue-on-error: false

    # Build AAB (Android App Bundle for Play Store)
    - name: Build AAB
      run: ./gradlew bundleRelease --stacktrace
      continue-on-error: false
    
    # Upload Release APK
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/app-release*.apk
        retention-days: 30
    
    # Upload AAB
    - name: Upload Release AAB
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: app/build/outputs/bundle/release/*.aab
        retention-days: 30
    
    # Create GitHub Release
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        tag_name: ${{ github.ref_name }}  # Use ref_name, not ref (v... instead of refs/tags/v...)
        name: Shollu Android v${{ steps.extract_version.outputs.version }}
        draft: false
        # Tags with a suffix (v3.11.0-rc1) publish as pre-releases, not stable
        prerelease: ${{ contains(github.ref_name, '-') }}
        files: |
          app/build/outputs/apk/release/app-release*.apk
          app/build/outputs/bundle/release/*.aab
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: release-build
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - name: Release Status
      run: |
        if [ "${{ needs.release-build.result }}" == "success" ]; then
          echo "✅ Release built successfully!"
          echo "Download APKs from the GitHub Release page"
        else
          echo "❌ Release build failed"
        fi
