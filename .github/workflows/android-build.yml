name: Android CI - Build & Release APK

on:
  push:
    branches: [ "main", "develop" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TOOL_VERSION: 36.0.0
  COMPILE_SDK: 37
  MIN_SDK: 26
  TARGET_SDK: 36

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7

    - name: Install Android SDK platform 37 + build-tools 36
      run: |
        SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKM" --licenses > /dev/null || true
        "$SDKM" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Grant execute permission to gradlew
      run: chmod +x ./gradlew
    
    # Debug: List files
    - name: Check Project Structure
      run: |
        echo "=== Directory Structure ==="
        ls -la
        echo "=== Gradle Files ==="
        ls -la *.gradle* || true
        echo "=== App Module ==="
        ls -la app/ || true
    
    # Fail fast if any build/runtime dependency resolves below a Dependabot patched floor
    - name: Dependency Security Gate
      run: ./gradlew verifyDependencySecurity --stacktrace
      continue-on-error: false

    # Run tests first (fail build if tests fail)
    - name: Run Tests
      run: ./gradlew test --stacktrace
      continue-on-error: false
    
    # Build Debug APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      continue-on-error: false
      
    # Upload Debug Artifacts
    - name: Upload Debug APK
      uses: actions/upload-artifact@v5
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7

  release-build:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required for creating GitHub releases
    
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    
    steps:
    - uses: actions/checkout@v7

    - name: Install Android SDK platform 37 + build-tools 36
      run: |
        SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKM" --licenses > /dev/null || true
        "$SDKM" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

    - name: Extract version from tag
      id: extract_version
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        VERSION=${TAG_NAME#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

        # Derive a monotonically increasing versionCode from the semver tag: MAJOR*10000 + MINOR*100 + PATCH
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        MAJOR=$(echo "${MAJOR:-0}" | tr -cd '0-9');  MAJOR=${MAJOR:-0}
        MINOR=$(echo "${MINOR:-0}" | tr -cd '0-9');  MINOR=${MINOR:-0}
        PATCH=$(echo "${PATCH%%-*}" | tr -cd '0-9'); PATCH=${PATCH:-0}
        # Formula collides if MINOR or PATCH exceeds 99 - refuse rather than emit a colliding code
        if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
          echo "::error::Tag v$VERSION: MINOR and PATCH must be <= 99 for versionCode derivation (MAJOR*10000+MINOR*100+PATCH)"
          exit 1
        fi
        VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
        echo "Computed versionCode: $VERSION_CODE"

        # Export for all subsequent steps; build.gradle.kts reads these env vars
        echo "RELEASE_VERSION_NAME=$VERSION" >> $GITHUB_ENV
        echo "RELEASE_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
    
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Grant execute permission to gradlew
      run: chmod +x ./gradlew
    
    # Read secrets for signing - export as env vars that Gradle can read
    - name: Setup signing credentials
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      run: |
        # Release builds must be signed with the release keystore - fail fast if secrets are missing
        MISSING=""
        [ -z "$KEYSTORE_BASE64" ] && MISSING="$MISSING KEYSTORE_BASE64"
        [ -z "$SIGNING_KEY_ALIAS" ] && MISSING="$MISSING SIGNING_KEY_ALIAS"
        [ -z "$SIGNING_KEY_PASSWORD" ] && MISSING="$MISSING SIGNING_KEY_PASSWORD"
        [ -z "$SIGNING_STORE_PASSWORD" ] && MISSING="$MISSING SIGNING_STORE_PASSWORD"
        if [ -n "$MISSING" ]; then
          echo "::error::Release signing secrets not set:$MISSING — see QUICKSTART.md Step 3 (gh secret set ...)"
          exit 1
        fi

        echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
        echo "✅ Keystore created successfully at app/release.keystore"

        # Export signing credentials for all subsequent steps (build.gradle.kts reads RELEASE_*)
        echo "RELEASE_STORE_FILE=app/release.keystore" >> $GITHUB_ENV
        echo "RELEASE_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> $GITHUB_ENV
        echo "RELEASE_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> $GITHUB_ENV
        echo "RELEASE_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> $GITHUB_ENV
    
    # Build Release APK (Gradle reads RELEASE_* env vars exported to GITHUB_ENV above)
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      continue-on-error: false

    # Build AAB (Android App Bundle for Play Store)
    - name: Build AAB
      run: ./gradlew bundleRelease --stacktrace
      continue-on-error: false

    # =====================================================================
    # Release artifact verification — a broken APK must NEVER reach users.
    # Guards against: signing-key drift (INSTALL_FAILED_UPDATE_INCOMPATIBLE),
    # versionCode regressions (VERSION_DOWNGRADE), misalignment on 16 KB-page
    # devices, debuggable/unsigned artifacts, wrong version stamped.
    # Runs BEFORE the GitHub Release is created — failure aborts publishing.
    # =====================================================================

    - name: Download previous release APK (update-path baseline)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Latest release that exists BEFORE this one = the baseline users have installed
        PREV_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
        if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "${{ github.ref_name }}" ]; then
          echo "PREV_TAG=" >> $GITHUB_ENV
          echo "No previous release found — fresh-install test only"
        else
          mkdir -p /tmp/prev-release
          if gh release download "$PREV_TAG" --pattern '*.apk' --dir /tmp/prev-release; then
            echo "PREV_TAG=$PREV_TAG" >> $GITHUB_ENV
            echo "PREV_APK=/tmp/prev-release/app-release.apk" >> $GITHUB_ENV
            echo "Baseline: $PREV_TAG"
          else
            echo "PREV_TAG=" >> $GITHUB_ENV
            echo "::warning::Previous release $PREV_TAG has no APK asset — skipping update-path checks"
          fi
        fi

    - name: Static artifact checks (signature, version, alignment, debuggable)
      run: |
        BT="$ANDROID_HOME/build-tools/36.0.0"
        NEW_APK=$(ls app/build/outputs/apk/release/app-release*.apk | head -1)
        echo "NEW_APK=$NEW_APK" >> $GITHUB_ENV
        FAIL=""

        # 1. APK signature must verify, and its signer cert is the continuity anchor
        "$BT/apksigner" verify --print-certs "$NEW_APK" > /tmp/new-certs.txt || FAIL="apksigner verify failed"
        NEW_CERT=$(sed -n 's/Signer #1 certificate SHA-256 digest: //p' /tmp/new-certs.txt)
        echo "New APK signer SHA-256: $NEW_CERT"

        # 2. Signing-key continuity: same cert as the previous published release.
        #    A different key means no user can UPDATE over their existing install
        #    (INSTALL_FAILED_UPDATE_INCOMPATIBLE — "App not installed").
        if [ -n "$PREV_APK" ]; then
          "$BT/apksigner" verify --print-certs "$PREV_APK" > /tmp/prev-certs.txt || FAIL="prev apksigner verify failed"
          PREV_CERT=$(sed -n 's/Signer #1 certificate SHA-256 digest: //p' /tmp/prev-certs.txt)
          echo "Previous release signer SHA-256: $PREV_CERT"
          if [ -n "$NEW_CERT" ] && [ "$NEW_CERT" != "$PREV_CERT" ]; then
            echo "::error::SIGNING KEY CHANGED since $PREV_TAG — users cannot update over existing installs"
            FAIL="signing key drift"
          fi
        fi

        # 3. versionCode/versionName stamped into the APK must match the tag exactly
        BADGING=$("$BT/aapt" dump badging "$NEW_APK" | head -1)
        echo "$BADGING"
        APK_VCODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
        APK_VNAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
        if [ "$APK_VCODE" != "$RELEASE_VERSION_CODE" ] || [ "$APK_VNAME" != "$RELEASE_VERSION_NAME" ]; then
          echo "::error::APK stamp mismatch: got versionCode=$APK_VCODE versionName=$APK_VNAME, expected $RELEASE_VERSION_CODE/$RELEASE_VERSION_NAME"
          FAIL="version stamp mismatch"
        fi

        # 4. versionCode must strictly increase over the previous release (no downgrades)
        if [ -n "$PREV_APK" ]; then
          PREV_BADGING=$("$BT/aapt" dump badging "$PREV_APK" | head -1)
          PREV_VCODE=$(echo "$PREV_BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          echo "versionCode: new=$APK_VCODE previous=$PREV_VCODE"
          if [ "${APK_VCODE:-0}" -le "${PREV_VCODE:-0}" ]; then
            echo "::error::versionCode did not increase ($PREV_VCODE -> $APK_VCODE) — installs would fail with VERSION_DOWNGRADE"
            FAIL="versionCode regression"
          fi
        fi

        # 5. 16 KB page alignment of uncompressed .so entries (Android 15+/16 devices)
        "$BT/zipalign" -c -P 16 4 "$NEW_APK" || FAIL="16KB alignment failed"

        # 6. Release build must not be debuggable
        if "$BT/aapt" dump xmltree "$NEW_APK" AndroidManifest.xml | grep -q 'android:debuggable'; then
          echo "::error::Release APK has android:debuggable set"
          FAIL="debuggable release"
        fi

        if [ -n "$FAIL" ]; then echo "::error::Static artifact checks FAILED: $FAIL"; exit 1; fi
        echo "✅ Static artifact checks passed"

    # Free the runner's RAM before booting the emulator — the Gradle daemon from
    # assembleRelease (~1-2 GB) starved adbd on the 7 GB runner and the probe's
    # adb shells died with "Transport endpoint is not connected".
    - name: Stop Gradle daemons
      run: ./gradlew --stop

    - name: Install test on Android 16 emulator (real update path)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 36
        arch: x86_64
        target: default          # AOSP image — no GMS cold-boot overhead; probe needs none
        force-avd-creation: false
        emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 2048
        emulator-boot-timeout: 600  # generous cold-boot budget; default budget was too tight for API-36 cold boot
        disable-animations: true
        script: |
          set -e
          # WARNING: the runner feeds this script to /usr/bin/sh LINE BY LINE — every
          # line MUST be a self-contained statement; shell variables never survive to
          # the next line, and multi-line functions/blocks fail to parse.
          OUT=$(adb install -r "$NEW_APK" 2>&1); echo "$OUT"; echo "$OUT" | grep -q '^Success$' || { echo "::error::fresh install failed on API-36 emulator — users would hit this"; exit 1; }
          V=$(adb shell dumpsys package com.ebsoft.shollu | grep -m1 'versionName=' | tr -d ' \r' | sed 's/versionName=//'); echo "installed versionName=$V"; [ "$V" = "$RELEASE_VERSION_NAME" ] || { echo "::error::installed versionName '$V' != tag '$RELEASE_VERSION_NAME'"; exit 1; }
          V=$(adb shell dumpsys package com.ebsoft.shollu | grep -m1 'versionCode=' | tr -d ' \r' | sed 's/.*versionCode=\([0-9]*\).*/\1/'); echo "installed versionCode=$V"; [ "$V" = "$RELEASE_VERSION_CODE" ] || { echo "::error::installed versionCode '$V' != expected '$RELEASE_VERSION_CODE'"; exit 1; }
          F=$(adb shell dumpsys package com.ebsoft.shollu | grep -m1 'pkgFlags' | tr -d '\r'); echo "$F"; case "$F" in *DEBUGGABLE*) echo "::error::DEBUGGABLE package shipped as release"; exit 1;; esac; echo "install + version stamps OK"
          adb shell pm grant com.ebsoft.shollu android.permission.ACCESS_FINE_LOCATION; adb shell pm grant com.ebsoft.shollu android.permission.ACCESS_COARSE_LOCATION; adb shell pm grant com.ebsoft.shollu android.permission.POST_NOTIFICATIONS
          adb shell monkey -p com.ebsoft.shollu -c android.intent.category.LAUNCHER 1; sleep 5
          B=""; for i in 1 2 3 4 5 6 7 8; do X=$(adb exec-out uiautomator dump /dev/tty 2>/dev/null); B=$(echo "$X" | grep -oE 'text="Pengaturan"[^>]*bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' | grep -oE '[0-9]+' | tr '\n' ' '); [ -n "$B" ] && break; sleep 3; done; [ -n "$B" ] && adb shell input tap $(( ($(echo "$B"|awk '{print $1}')+$(echo "$B"|awk '{print $3}'))/2 )) $(( ($(echo "$B"|awk '{print $2}')+$(echo "$B"|awk '{print $4}'))/2 )) || { echo "::error::Pengaturan tab not found/tappable on home"; exit 1; }
          sleep 2
          B=""; for i in 1 2 3 4 5 6 7 8; do X=$(adb exec-out uiautomator dump /dev/tty 2>/dev/null); B=$(echo "$X" | grep -oE 'text="Kota / Lokasi Aktif"[^>]*bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' | grep -oE '[0-9]+' | tr '\n' ' '); [ -n "$B" ] && break; sleep 3; done; [ -n "$B" ] && adb shell input tap $(( ($(echo "$B"|awk '{print $1}')+$(echo "$B"|awk '{print $3}'))/2 )) $(( ($(echo "$B"|awk '{print $2}')+$(echo "$B"|awk '{print $4}'))/2 )) || { echo "::error::city row not found/tappable in Pengaturan"; exit 1; }
          sleep 2
          X=""; for i in 1 2 3 4 5 6 7 8; do X=$(adb exec-out uiautomator dump /dev/tty 2>/dev/null); echo "$X" | grep -q 'Pilih Kota' && break; sleep 3; done; R=$(echo "$X" | grep -o '• Indonesia' | wc -l); echo "city rows visible in picker: $R"; [ "${R:-0}" -ge 3 ] || { echo "::error::city picker list EMPTY in release build — minify/reflection regression (check proguard-rules.pro keeps)"; exit 1; }; echo "RELEASE GATE PASSED"

    # Upload Release APK
    - name: Upload Release APK
      uses: actions/upload-artifact@v5
      with:
        name: release-apk
        path: app/build/outputs/apk/release/app-release*.apk
        retention-days: 30
    
    # Upload AAB
    - name: Upload Release AAB
      uses: actions/upload-artifact@v5
      with:
        name: release-aab
        path: app/build/outputs/bundle/release/*.aab
        retention-days: 30
    
    # Create GitHub Release
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      if: success()
      with:
        tag_name: ${{ github.ref_name }}  # Use ref_name, not ref (v... instead of refs/tags/v...)
        name: Shollu Android v${{ steps.extract_version.outputs.version }}
        draft: false
        # Tags with a suffix (v3.11.0-rc1) publish as pre-releases, not stable
        prerelease: ${{ contains(github.ref_name, '-') }}
        files: |
          app/build/outputs/apk/release/app-release*.apk
          app/build/outputs/bundle/release/*.aab
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: release-build
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - name: Release Status
      run: |
        if [ "${{ needs.release-build.result }}" == "success" ]; then
          echo "✅ Release built successfully!"
          echo "Download APKs from the GitHub Release page"
        else
          echo "❌ Release build failed"
        fi
